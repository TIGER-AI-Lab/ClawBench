<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How ClawBench works</title>
<desc id="desc">Choose an everyday task, prepare a local or remote browser runtime, run an agent on the live website, and capture five layers of evidence to evaluate task success.</desc>
<g transform="translate(8 8)">
<rect width="218" height="204" rx="16" fill="#FFFCF8" stroke="#DFE2E6"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#B84A34">01</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#5C6571">TASK</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="27" y="54" width="45" height="48" rx="7"/><path d="M39 51h20v8H39zM38 74h18m-18 10h24m-24 10h14"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#20242C">Choose a task</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#5C6571">An everyday scenario</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#5C6571">on a live website.</text>
</g>
<g transform="translate(250 8)">
<rect width="218" height="204" rx="16" fill="#FFFCF8" stroke="#DFE2E6"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#B84A34">02</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#5C6571">RUNTIME</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="23" y="53" width="56" height="44" rx="7"/><path d="M23 65h56m-43-6h1m6 0h1m6 0h1M36 77l6 5-6 5m13 0h14"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#20242C">Prepare runtime</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#5C6571">Local container or</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#5C6571">remote browser.</text>
</g>
<g transform="translate(492 8)">
<rect width="218" height="204" rx="16" fill="#FFFCF8" stroke="#DFE2E6"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#B84A34">03</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#5C6571">AGENT</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 53v43l13-13 10 22 9-5-10-21h18ZM68 52l6-7m4 23h10M48 49V42"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#20242C">Run the agent</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#5C6571">Navigate, fill forms,</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#5C6571">and take actions.</text>
</g>
<g transform="translate(734 8)">
<rect width="218" height="204" rx="16" fill="#FFFCF8" stroke="#DFE2E6"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#B84A34">04</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#5C6571">EVIDENCE</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m23 68 28-16 28 16-28 16Zm0 13 28 16 28-16m-56 14 28 16 28-16"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#20242C">Record &amp; score</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#5C6571">Capture five layers;</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#5C6571">evaluate task success.</text>
</g>
<path d="M232 110h12m-5-5 5 5-5 5M474 110h12m-5-5 5 5-5 5M716 110h12m-5-5 5 5-5 5" fill="none" stroke="#E7EBEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
