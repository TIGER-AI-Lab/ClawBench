<svg xmlns="http://www.w3.org/2000/svg" width="460" height="456" viewBox="0 0 460 456" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How ClawBench works</title>
<desc id="desc">Choose an everyday task, prepare a local or remote browser runtime, run an agent on the live website, and capture five layers of evidence to evaluate task success.</desc>
<g transform="translate(8 8)">
<rect width="202" height="204" rx="16" fill="#151B25" stroke="#34404F"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#FC9C84">01</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#B6BEC9">TASK</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="27" y="54" width="45" height="48" rx="7"/><path d="M39 51h20v8H39zM38 74h18m-18 10h24m-24 10h14"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#F3F1ED">Choose a task</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#B6BEC9">An everyday scenario</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#B6BEC9">on a live website.</text>
</g>
<g transform="translate(250 8)">
<rect width="202" height="204" rx="16" fill="#151B25" stroke="#34404F"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#FC9C84">02</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#B6BEC9">RUNTIME</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="23" y="53" width="56" height="44" rx="7"/><path d="M23 65h56m-43-6h1m6 0h1m6 0h1M36 77l6 5-6 5m13 0h14"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#F3F1ED">Prepare runtime</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#B6BEC9">Local container or</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#B6BEC9">remote browser.</text>
</g>
<g transform="translate(8 244)">
<rect width="202" height="204" rx="16" fill="#151B25" stroke="#34404F"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#FC9C84">03</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#B6BEC9">AGENT</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 53v43l13-13 10 22 9-5-10-21h18ZM68 52l6-7m4 23h10M48 49V42"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#F3F1ED">Run the agent</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#B6BEC9">Navigate, fill forms,</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#B6BEC9">and take actions.</text>
</g>
<g transform="translate(250 244)">
<rect width="202" height="204" rx="16" fill="#151B25" stroke="#34404F"/>
<text x="22" y="32" font-size="12" font-weight="750" fill="#FC9C84">04</text>
<text x="49" y="32" font-size="10" font-weight="650" fill="#B6BEC9">EVIDENCE</text>
<g fill="none" stroke="#EB6449" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m23 68 28-16 28 16-28 16Zm0 13 28 16 28-16m-56 14 28 16 28-16"/></g>
<text x="22" y="136" font-size="17" font-weight="750" fill="#F3F1ED">Record &amp; score</text>
<text x="22" y="161" font-size="12.5" font-weight="500" fill="#B6BEC9">Capture five layers;</text>
<text x="22" y="180" font-size="12.5" font-weight="500" fill="#B6BEC9">evaluate task success.</text>
</g>
<path d="M216 110h26m-5-5 5 5-5 5M216 346h26m-5-5 5 5-5 5M350 218v10H110v10m-5-5 5 5 5-5" fill="none" stroke="#34404F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
