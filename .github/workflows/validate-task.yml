name: validate-task

on:
    pull_request:
        branches: [main]
        paths:
            - ".github/workflows/validate-task.yml"
            - "scripts/ci/validate_tasks.py"
            - "test-cases/task.schema.json"
            - "test-cases/**/*.json"
            - "test-cases/**/extra_info/**"
    push:
        branches: [main]
        paths:
            - ".github/workflows/validate-task.yml"
            - "scripts/ci/validate_tasks.py"
            - "test-cases/task.schema.json"
            - "test-cases/**/*.json"
            - "test-cases/**/extra_info/**"
    workflow_dispatch:

jobs:
    validate-task:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install validator
              run: python -m pip install "jsonschema==4.26.0"

            - name: Collect changed task files
              id: changed
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    base="${{ github.event.pull_request.base.sha }}"
                    git diff --name-only "$base"...HEAD > changed-files.txt
                  elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
                    git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
                  else
                    # workflow_dispatch, or a push with no usable base: check everything.
                    : > changed-files.txt
                    echo "validate_all=true" >> "$GITHUB_OUTPUT"
                  fi

                  echo "Changed files:"
                  cat changed-files.txt

            - name: Validate changed tasks
              run: |
                  if [[ "${{ steps.changed.outputs.validate_all }}" == "true" ]]; then
                    python scripts/ci/validate_tasks.py --all
                  else
                    python scripts/ci/validate_tasks.py --changed-files changed-files.txt
                  fi
              shell: bash
